<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title><%=(settings["Site.site_title"]) ? settings["Site.site_title"] : "";%></title>
        <!-- Bootstrap Css -->
        <link rel="stylesheet" href="<%=WEBSITE_CSS_PATH%>bootstrap.min.css" type="text/css">
        <link rel="stylesheet" href="<%=WEBSITE_CSS_PATH%>font-awesome.min.css" type="text/css">
      
        <!-- jquery -->
        <script src="<%=WEBSITE_JS_PATH%>jquery.min.js"></script>
        <script src="<%=WEBSITE_JS_PATH%>bootstrap.min.js"></script>

        <script>
            LOADING_SPINNER 	= "<%- LOADING_SPINNER %>";
            DEFAULT_TIME_ZONE	= '<%- DEFAULT_TIME_ZONE; %>';
     		WEBSITE_SOCKET_URL	= "<%= WEBSITE_SOCKET_URL %>";
			var encryptionKey  	= '<%= (auth._id) ? auth._id : "" %>';
     		FRONT_DATE_FORMAT	= '<%- FRONT_DATE_FORMAT; %>';
           
            /**
             * Function is used to send ajax requests
             * @params options As options
             */
            function getRequest(options,callback){
                var url 	= (options.url) 	? options.url	: "";
                var method	= (options.method)  ? options.method: "";
                var data	= (options.data) 	? options.data	: {};
                if(url && data && method){
                    $.ajax({
                        'type'	    : method,
                        'url'	    : url,
                        'data'	    : data,
                        'success'   : function (response){
                            callback(response);
                        }
                    });
                }else{
                    callback({status:'<%=STATUS_ERROR%>',message:"Missing parameters" });
                }
            }
        </script>
    </head>
    <body>
        <%- body %>
        <!-- Side Menu -->
        
        <link rel="stylesheet" href="<%=WEBSITE_CSS_PATH%>developer.css" type="text/css">
        <link rel="stylesheet" href="<%=WEBSITE_CSS_PATH%>loading-btn.css" type="text/css">
        <link rel="stylesheet" href="<%=WEBSITE_CSS_PATH%>jquery.toast.css" type="text/css">
        <%- defineContent("css") %>
        <!-- Moment Js -->
		<script src="<%=WEBSITE_ADMIN_JS_PATH%>socket.io-1.4.5.js" type="text/javascript"></script>

        <script src="<%=WEBSITE_JS_PATH%>jquery.toast.js" type="text/javascript"></script>
        <script src="<%=WEBSITE_JS_PATH%>jquery.form.js" type="text/javascript"></script>
        <script src="<%=WEBSITE_JS_PATH%>custom.js"></script>
        <script src="<%=WEBSITE_JS_PATH%>bootbox.min.js"></script>
        <script type="text/javascript">
            $(document).ready(function(){
                /**
                 * Function for socket requests to users
                 */
                if(typeof io !== typeof undefined){
                    var client = io.connect(WEBSITE_SOCKET_URL, {'transports': ['websocket']});
                        client.on('connect',function (data) {
                        client.emit('login', {id: encryptionKey});
                    });
                }

                /** message popup script **/
                <% if (success_status && success_status == STATUS_SUCCESS) { %>
                    notice("<%=success_status; %>","<%- success_flash_message %>");
                <% } %>
                <% if (error_status && error_status ==  STATUS_ERROR) { %>
                    notice("<%= error_status; %>","<%- error_flash_message %>");
                <% } %>
            });
		</script>
        <%- defineContent("script") %>
    </body>
</html>
